<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Kindle Sudoku v3</title><style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%}body{padding:4px 7px;text-align:center}#app{width:100%;max-width:600px;margin:auto}#top{height:30px;line-height:30px;text-align:left}#title{font-size:20px;font-weight:bold}#level{float:right;font-size:14px;font-weight:bold}#board{border-collapse:collapse;table-layout:fixed;width:100%;border:3px solid #000;margin:1px auto 4px}#board td{border:1px solid #777;padding:0;width:11.11%;height:44px}#board tr:nth-child(3) td,#board tr:nth-child(6) td{border-bottom:3px solid #000}#board td:nth-child(3),#board td:nth-child(6){border-right:3px solid #000}.cell{display:block;width:100%;height:44px;line-height:44px;margin:0;padding:0;border:0;border-radius:0;background:#fff;color:#000;font-size:22px;text-align:center;-webkit-appearance:none}.given{font-weight:bold}.peer{background:#eee}.selected{background:#ccc!important}#keys,#actions{width:100%;white-space:nowrap}.key{display:inline-block;width:9.7%;height:40px;margin:0 .35%;padding:0;border:2px solid #000;border-radius:0;background:#fff;color:#000;font-size:18px;font-weight:bold;-webkit-appearance:none}.action{display:inline-block;height:39px;margin:3px .4% 0;padding:0;border:2px solid #000;border-radius:0;background:#fff;color:#000;font-size:14px;font-weight:bold;-webkit-appearance:none}#notes{width:28%}#erase{width:28%}#new{width:39%}#msg{height:18px;line-height:18px;font-size:12px;text-align:left;white-space:nowrap;overflow:hidden}.on{background:#000!important;color:#fff!important}
</style></head><body><div id="app"><div id="top"><span id="title">SUDOKU</span><span id="level">Prueba v3</span></div><table id="board"><tbody></tbody></table><div id="keys"><button class="key" data-v="1">1</button><button class="key" data-v="2">2</button><button class="key" data-v="3">3</button><button class="key" data-v="4">4</button><button class="key" data-v="5">5</button><button class="key" data-v="6">6</button><button class="key" data-v="7">7</button><button class="key" data-v="8">8</button><button class="key" data-v="9">9</button></div><div id="actions"><button id="notes" class="action">Notas: NO</button><button id="erase" class="action">Borrar</button><button id="new" class="action">Nueva partida</button></div><div id="msg">Selecciona una casilla vacía.</div></div>
<script>(function(){var KEY="kindleSudokuV3",p="530070000600195000098000060800060003400803001700020006060000280000419005000080079",tb=document.getElementById("board").getElementsByTagName("tbody")[0],cells=[],sel=-1,notes=false,msg=document.getElementById("msg"),nb=document.getElementById("notes");
function peer(a,b){var ar=Math.floor(a/9),ac=a%9,br=Math.floor(b/9),bc=b%9;return ar==br||ac==bc||(Math.floor(ar/3)==Math.floor(br/3)&&Math.floor(ac/3)==Math.floor(bc/3))}
function paint(){for(var i=0;i<81;i++){var c=cells[i].getAttribute("data-g")=="1"?"cell given":"cell";if(sel>=0&&i!=sel&&peer(i,sel))c+=" peer";if(i==sel)c+=" selected";cells[i].className=c}}
function select(i){sel=i;paint();msg.innerHTML=cells[i].getAttribute("data-g")=="1"?"Número fijo.":"Casilla seleccionada."}
function save(){try{var a=[];for(var i=0;i<81;i++)a.push(cells[i].getAttribute("data-g")=="1"?"":cells[i].innerHTML||"");localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function load(){try{var x=localStorage.getItem(KEY);if(!x)return;var a=JSON.parse(x);for(var i=0;i<81;i++)if(cells[i].getAttribute("data-g")!="1")cells[i].innerHTML=a[i]||""}catch(e){}}
for(var r=0;r<9;r++){var tr=document.createElement("tr");for(var c=0;c<9;c++){var i=r*9+c,td=document.createElement("td"),b=document.createElement("button"),ch=p.charAt(i);b.className="cell";b.setAttribute("data-g",ch!="0"?"1":"0");b.innerHTML=ch!="0"?ch:"";(function(n,x){x.onclick=function(){select(n)}})(i,b);td.appendChild(b);tr.appendChild(td);cells.push(b)}tb.appendChild(tr)}
load();paint();var ks=document.getElementsByClassName("key");for(var k=0;k<ks.length;k++)ks[k].onclick=function(){if(sel<0||cells[sel].getAttribute("data-g")=="1"){msg.innerHTML="Selecciona una casilla vacía.";return}if(notes){msg.innerHTML="Notas se implementarán después.";return}cells[sel].innerHTML=this.getAttribute("data-v");save();msg.innerHTML="Guardado."};
document.getElementById("erase").onclick=function(){if(sel>=0&&cells[sel].getAttribute("data-g")!="1"){cells[sel].innerHTML="";save();msg.innerHTML="Borrado."}};
nb.onclick=function(){notes=!notes;nb.innerHTML=notes?"Notas: SÍ":"Notas: NO";nb.className=notes?"action on":"action"};
document.getElementById("new").onclick=function(){for(var i=0;i<81;i++)if(cells[i].getAttribute("data-g")!="1")cells[i].innerHTML="";save();sel=-1;paint();msg.innerHTML="Partida reiniciada."};
})();</script></body></html>
