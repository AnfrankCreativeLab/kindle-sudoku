 for(j=0;j<81;j++)if(j!==i&&getValue(j)===v&&isPeer(i,j))return true;
 return false;
}
function stopConflictBlink(){
 if(conflictBlinkTimer){clearInterval(conflictBlinkTimer);conflictBlinkTimer=null;}
 conflictBlinkVisible=true;
}
function startConflictBlink(){
 var ticks=0;
 stopConflictBlink();
 conflictBlinkVisible=true;
 repaint();
 conflictBlinkTimer=setInterval(function(){
  ticks++;
  conflictBlinkVisible=!conflictBlinkVisible;
  repaint();
  if(ticks>=6){
   stopConflictBlink();
   repaint();
  }
 },320);
}
function repaint(){
 var i,base,all=conflictMap();
 for(i=0;i<81;i++){
  base=cells[i].getAttribute("data-given")==="1"?"cell given":"cell";
  if(all[i]&&conflictBlinkVisible)base+=" conflict";
  if(flashValue&&getValue(i)===flashValue)base+=" sameflash";
  if(completeFlashCells[i])base+=" completeflash";
  if(i===selected&&!all[i])base+=" selected";
  cells[i].className=base;
  renderCell(i);
 }
}
function save(){
 try{
  var s=[],i;
  for(i=0;i<81;i++)s.push({v:getValue(i),n:getNotes(i)});
  localStorage.setItem(SAVE_PREFIX+data().id,JSON.stringify({cells:s,errors:errors,started:started}));
 }catch(e){}
}
function load(){
 try{
  var raw=localStorage.getItem(SAVE_PREFIX+data().id),o,a,i;
  errors=0;started=false;
  if(!raw)return;
  o=JSON.parse(raw);
  if(o&&o.cells){a=o.cells;errors=parseInt(o.errors||0,10);started=!!o.started;}
  else{a=o;}
  if(!a||!a.length)return;
  for(i=0;i<81&&i<a.length;i++)if(cells[i].getAttribute("data-given")!=="1"){
   cells[i].setAttribute("data-value",a[i].v||"");
   cells[i].setAttribute("data-notes",a[i].n||"");
  }
 }catch(e){errors=0;started=false;}
}
function currentDifficultyLabel(){
 return level===4?"Mix":data().difficulty;
}
function closeLevelSelector(){
 levelSelectorOpen=false;
 if(levelSelectorTimer){clearTimeout(levelSelectorTimer);levelSelectorTimer=null;}
 updateTop();
}
function updateTop(){
 document.getElementById("puzzleLabel").innerHTML=data().visible;
 document.getElementById("difficultyBtn").innerHTML=(started&&!levelSelectorOpen)?("Err "+errors):currentDifficultyLabel();
}
function difficultyAction(){
 cancelReset();
 cancelSolveConfirm();
 if(started&&!levelSelectorOpen){
  levelSelectorOpen=true;
  updateTop();
  if(levelSelectorTimer)clearTimeout(levelSelectorTimer);
  levelSelectorTimer=setTimeout(function(){closeLevelSelector();},3000);
  return;
 }
 if(levelSelectorTimer){clearTimeout(levelSelectorTimer);levelSelectorTimer=null;}
 levelSelectorOpen=false;
 cycleDifficulty();
}
function showCredit(){
 var o=document.getElementById("creditOverlay");
 cancelReset();
 cancelSolveConfirm();
 o.style.display=(o.style.display==="block")?"none":"block";
}
function buildPuzzle(){
 var p=data(),i,ch;
 document.getElementById("creditOverlay").style.display="none";
 if(solveTimer){clearTimeout(solveTimer);solveTimer=null;}
 if(resetTimer){clearTimeout(resetTimer);resetTimer=null;}
 if(levelSelectorTimer){clearTimeout(levelSelectorTimer);levelSelectorTimer=null;}
 stopConflictBlink();
 selected=-1;notesMode=false;notesTopBtn.className="topbtn";
 solveArmed=false;resetArmed=false;showingSolution=false;levelSelectorOpen=false;
 solveBtn.innerHTML="Solve";
 document.getElementById("resetBtn").innerHTML="Reset";
 errors=0;started=false;
 for(i=0;i<81;i++){
  ch=p.puzzle.charAt(i);
  cells[i].setAttribute("data-given",ch!=="0"?"1":"0");
  cells[i].setAttribute("data-value",ch!=="0"?ch:"");
  cells[i].setAttribute("data-notes","");
 }
 load();
 updateTop();
 repaint();
 makeSquare();
 initCompletedUnits();
}
function unitKey(type,n){return type+String(n);}
function unitIndices(type,n){
 var a=[],i,r,c,br,bc;
 if(type==="r"){for(c=0;c<9;c++)a.push(n*9+c);}
 else if(type==="c"){for(r=0;r<9;r++)a.push(r*9+n);}
 else{
  br=Math.floor(n/3)*3;bc=(n%3)*3;
  for(r=0;r<3;r++)for(c=0;c<3;c++)a.push((br+r)*9+(bc+c));
 }
 return a;
}
function unitCorrect(type,n){
 var a=unitIndices(type,n),i,v,seen={};
 for(i=0;i<a.length;i++){
  v=getValue(a[i]);
  if(!v||seen[v])return false;
  seen[v]=1;
 }
 return true;
}
function flashCompleted(indices){
 var i;
 if(flashTimer){clearTimeout(flashTimer);flashTimer=null;}
 flashValue="";
 if(completeTimer){clearTimeout(completeTimer);completeTimer=null;}
 completeFlashCells={};
 for(i=0;i<indices.length;i++)completeFlashCells[indices[i]]=1;
 repaint();
 completeTimer=setTimeout(function(){
  completeFlashCells={};
  completeTimer=null;
  selected=-1;
  repaint();
 },1500);
}
function checkNewCompletions(changedIndex){
 var r=Math.floor(changedIndex/9),c=changedIndex%9,b=Math.floor(r/3)*3+Math.floor(c/3);
 var tests=[["r",r],["c",c],["b",b]],i,key,newCells=[];
 for(i=0;i<tests.length;i++){
  key=unitKey(tests[i][0],tests[i][1]);
  if(unitCorrect(tests[i][0],tests[i][1])){
   if(!completedUnits[key]){
    completedUnits[key]=1;
    newCells=newCells.concat(unitIndices(tests[i][0],tests[i][1]));
   }
  }else{
   completedUnits[key]=0;
  }
 }
 if(newCells.length)flashCompleted(newCells);
}
function initCompletedUnits(){
 var t,n,key;
 completedUnits={};
 for(t=0;t<3;t++)for(n=0;n<9;n++){
  key=unitKey(t===0?"r":(t===1?"c":"b"),n);
  completedUnits[key]=unitCorrect(t===0?"r":(t===1?"c":"b"),n)?1:0;
 }
}
function selectCell(i){
 var all;
 if(showingSolution)hideSolution();
 cancelSolveConfirm();
 cancelReset();
 all=conflictMap();
 if(hasConflicts()){
  if(all[i]&&cells[i].getAttribute("data-given")!=="1"){
   cells[i].setAttribute("data-value","");
   cells[i].setAttribute("data-notes","");
   selected=-1;
   stopConflictBlink();
   save();
   repaint();
   initCompletedUnits();
  }
  return;
 }
 selected=i;
 repaint();
}
function flashSameNumber(v){
 if(flashTimer){clearTimeout(flashTimer);flashTimer=null;}
 flashValue=v;
 repaint();
 flashTimer=setTimeout(function(){
  flashValue="";
  flashTimer=null;
  repaint();
 },900);
}
function setNumber(v){
 if(showingSolution)hideSolution();
 cancelSolveConfirm();
 cancelReset();
 if(selected<0||showingSolution)return;
 var c=cells[selected],nts,p,idx=selected,conflict;
 if(c.getAttribute("data-given")==="1")return;
 if(hasConflicts())return;
 started=true;
 levelSelectorOpen=false;
 if(levelSelectorTimer){clearTimeout(levelSelectorTimer);levelSelectorTimer=null;}
 if(notesMode){
  nts=getNotes(selected);
  p=nts.indexOf(v);
  if(getValue(selected))c.setAttribute("data-value","");
  if(p>=0)nts=nts.replace(v,"");else nts+=v;
  nts=nts.split("").sort().join("");
  c.setAttribute("data-notes",nts);
  selected=-1;
  save();
  updateTop();
  repaint();
  return;
 }
 c.setAttribute("data-notes","");
 if(getValue(selected)===v){
  c.setAttribute("data-value","");
  selected=-1;
  save();
  updateTop();
  repaint();
  initCompletedUnits();
  return;
 }
 conflict=wouldConflict(selected,v);
 c.setAttribute("data-value",v);
 selected=-1;
 flashValue="";
 if(flashTimer){clearTimeout(flashTimer);flashTimer=null;}
 if(conflict){
  errors++;
  save();
  updateTop();
  startConflictBlink();
  return;
 }
 save();
 updateTop();
 flashSameNumber(v);
 checkNewCompletions(idx);
}
function randomPick(){
 var lv=1+Math.floor(Math.random()*3),idx=Math.floor(Math.random()*puzzleSets[lv].length);
 if(level===4){
  var cur=document.getElementById("puzzleLabel").innerHTML+"|"+document.getElementById("difficultyBtn").getAttribute("data-real");
  var tries=0;
  while((puzzleSets[lv][idx].visible+"|"+lv)===cur&&tries<10){lv=1+Math.floor(Math.random()*3);idx=Math.floor(Math.random()*puzzleSets[lv].length);tries++;}
 }
 level=4;
 document.getElementById("difficultyBtn").setAttribute("data-real",lv);
 index=idx;
 buildPuzzle();
}
function changePuzzle(step){
 if(level===4){randomPick();return;}
 var a=puzzleSets[level],ni=index+step;
 if(ni<0||ni>=a.length)return;
 index=ni;
 buildPuzzle();
}
function cycleDifficulty(){
 if(level===1){level=2;index=0;buildPuzzle();}
 else if(level===2){level=3;index=0;buildPuzzle();}
 else if(level===3){randomPick();}
 else{level=1;index=0;buildPuzzle();}
}
function cancelSolveConfirm(){
 if(solveTimer&&solveArmed){clearTimeout(solveTimer);solveTimer=null;}
 if(solveArmed&&!showingSolution){
  solveArmed=false;
  solveBtn.innerHTML="Solve";
 }
}

function cancelReset(){
 resetArmed=false;
 if(resetTimer){clearTimeout(resetTimer);resetTimer=null;}
 var b=document.getElementById("resetBtn");
 if(b)b.innerHTML="Reset";
}
function armReset(){
 var wasArmed=resetArmed,d,i,ch;
 if(showingSolution)hideSolution();
 cancelSolveConfirm();
 if(!wasArmed){
  resetArmed=true;
  document.getElementById("resetBtn").innerHTML="Sure?";
  if(resetTimer)clearTimeout(resetTimer);
  resetTimer=setTimeout(function(){cancelReset();},3000);
  return;
 }
 cancelReset();
 d=data();
 stopConflictBlink();
 for(i=0;i<81;i++){
  ch=d.puzzle.charAt(i);
  cells[i].setAttribute("data-given",ch!=="0"?"1":"0");
  cells[i].setAttribute("data-value",ch!=="0"?ch:"");
  cells[i].setAttribute("data-notes","");
 }
 selected=-1;
 notesMode=false;
 notesTopBtn.className="topbtn";
 flashValue="";
 if(flashTimer){clearTimeout(flashTimer);flashTimer=null;}
 completeFlashCells={};
 if(completeTimer){clearTimeout(completeTimer);completeTimer=null;}
 showingSolution=false;
 solveArmed=false;
 solveBtn.innerHTML="Solve";
 errors=0;
 started=false;
 levelSelectorOpen=false;
 if(levelSelectorTimer){clearTimeout(levelSelectorTimer);levelSelectorTimer=null;}
 try{localStorage.removeItem(SAVE_PREFIX+d.id);}catch(e){}
 initCompletedUnits();
 updateTop();
 repaint();
 makeSquare();
}

function armSolve(){
 cancelReset();
 cancelSolveConfirm();
 solveArmed=true;
 solveBtn.innerHTML="Sure?";
 solveTimer=setTimeout(function(){
  solveTimer=null;
  if(solveArmed&&!showingSolution){
   solveArmed=false;
   solveBtn.innerHTML="Solve";
  }
 },3000);
}
function hideSolution(){
 if(solveTimer){clearTimeout(solveTimer);solveTimer=null;}
 showingSolution=false;
 completeFlashCells={};
 solveArmed=false;
 solveBtn.innerHTML="Solve";
 repaint();
 makeSquare();
}
function revealSolution(){
 if(solveTimer){clearTimeout(solveTimer);solveTimer=null;}
 solveArmed=false;
 resetArmed=false;
 showingSolution=true;
 solveBtn.innerHTML="Solved";
 repaint();
 makeSquare();
 solveTimer=setTimeout(function(){
  solveTimer=null;
  showingSolution=false;
  solveBtn.innerHTML="Solve";
  repaint();
  makeSquare();
 },6000);
}
function toggleSolve(){
 if(showingSolution){hideSolution();return;}
 if(!solveArmed)armSolve();
 else revealSolution();
}
for(var r=0;r<9;r++){var tr=document.createElement("tr");for(var c=0;c<9;c++){var i=r*9+c,td=document.createElement("td"),b=document.createElement("button"),v=document.createElement("span"),n=document.createElement("span"),s=document.createElement("span");b.type="button";b.className="cell";b.setAttribute("data-given","0");b.setAttribute("data-value","");b.setAttribute("data-notes","");v.className="value";n.className="notes";s.className="solution";b.appendChild(v);b.appendChild(n);b.appendChild(s);td.appendChild(b);tr.appendChild(td);cells.push(b);(function(idx,btn){btn.onclick=function(){selectCell(idx)}})(i,b);}tb.appendChild(tr);}
var keys=document.getElementsByClassName("numberKey"),k;for(k=0;k<keys.length;k++)keys[k].onclick=function(){setNumber(this.getAttribute("data-v"));};
notesTopBtn.onclick=function(){
 if(showingSolution)hideSolution();
 cancelSolveConfirm();
 cancelReset();
 notesMode=!notesMode;
 notesTopBtn.className=notesMode?"topbtn on":"topbtn";
 repaint();
};
document.getElementById("prevBtn").onclick=function(){if(showingSolution)hideSolution();cancelSolveConfirm();changePuzzle(-1)};
document.getElementById("nextBtn").onclick=function(){if(showingSolution)hideSolution();cancelSolveConfirm();changePuzzle(1)};
document.getElementById("difficultyBtn").onclick=function(){if(showingSolution)hideSolution();difficultyAction();};
document.getElementById("title").onclick=showCredit;
document.getElementById("creditOverlay").onclick=function(){this.style.display="none";};
solveBtn.onclick=toggleSolve;
window.onresize=makeSquare;
buildPuzzle();
document.getElementById("resetBtn").onclick=function(){armReset();};
})();
</script>
</body>
</html>
